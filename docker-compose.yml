name: mcp-gateway

services:
  mcp-admin:
    build: ./mcp-admin
    image: mcp-admin:v1
    container_name: mcp-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8330:8330"
    environment:
      - ADMIN_DATA_DIR=/app/data
      - ADMIN_PEPPER_FILE=/app/secrets/token_hmac_pepper
    volumes:
      # 管理端挂载整个 data/（读写）：负责写各 MCP 的 config.json 与自身 admin/ 目录
      - ./data:/app/data
      - ./secrets:/app/secrets:ro
    networks:
      - net-admin
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  groksearch:
    build: ./groksearch
    image: mcp-groksearch:v1
    container_name: mcp-groksearch
    restart: unless-stopped
    ports:
      - "127.0.0.1:8321:8321"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8321
      - GROK_CONFIG_DIR=/app/data
      - GROK_LOG_DIR=/app/logs
    # 上游密钥不进 env：由 mcp-admin 写 data/grok/config.json（env_file 仅留非敏感项时也无需继承）
    volumes:
      - ./data/grok:/app/data
      - ./logs/grok:/app/logs
    networks:
      - net-grok
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  codexmcp:
    build: ./codexmcp
    image: mcp-codexmcp:v1
    container_name: mcp-codexmcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8322:8322"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8322
      - CODEX_CD_ALLOWLIST=/workspace:/var/lib/codexmcp/reviews
      - CODEX_MAX_CONCURRENCY=2
      - MCP_ALLOWED_HOSTS=mcp.hybaliez.xyz
      # 远程审查（方案 §20 中央配置）
      - CODEXMCP_UPLOAD_ROOT=/var/lib/codexmcp/uploads
      - CODEXMCP_REVIEW_ROOT=/var/lib/codexmcp/reviews
      - CODEXMCP_STATE_DB=/var/lib/codexmcp/state/codexmcp.sqlite3
      - CODEXMCP_MAX_UPLOAD_BYTES=314572800
      - CODEXMCP_MAX_UNPACKED_BYTES=2147483648
      - CODEXMCP_MAX_FILE_COUNT=100000
      - CODEXMCP_MAX_SINGLE_FILE_BYTES=20971520
      - CODEXMCP_MAX_COMPRESSION_RATIO=100
      - CODEXMCP_UPLOAD_TTL_SECONDS=1800
      - CODEXMCP_REVIEW_IDLE_TTL_SECONDS=3600
      - CODEXMCP_REVIEW_HARD_TTL_SECONDS=7200
      - CODEXMCP_CLEANUP_INTERVAL_SECONDS=300
      - CODEXMCP_GLOBAL_CONCURRENCY=2
      - CODEXMCP_PER_CLIENT_CONCURRENCY=1
      - CODEXMCP_CODEX_TIMEOUT_SECONDS=1800
    volumes:
      - ./workspace:/workspace
      # Codex 凭据/配置持久化（deploy 后 docker exec codex login；recreate 不丢）
      - ./data/codex/home:/home/node
      # 远程审查：上传暂存/审查 workspace/状态库（TTL 自动清理，备份时排除 reviews/ 内容）
      - ./data/codex/store:/var/lib/codexmcp
    networks:
      - net-codex
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  amapmcp:
    build: ./amapmcp
    image: mcp-amapmcp:v1
    container_name: mcp-amapmcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8323:8323"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8323
      - AMAP_CONFIG_FILE=/app/data/config.json
    # 上游 Key 不进 env：mcp-admin 写 data/amap/config.json，wrapper 启动时注入（改 Key 需重启容器）
    # 审查修复#5：MCP 容器只读配置（写者唯一 = mcp-admin），防止进程被利用后篡改持久化配置
    volumes:
      - ./data/amap:/app/data:ro
    networks:
      - net-amap
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  zoteromcp:
    build: ./zoteromcp
    image: mcp-zoteromcp:v1
    container_name: mcp-zoteromcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:8324:8324"
    environment:
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8324
      - ZOTERO_CONFIG_FILE=/app/data/config.json
      - MCP_ALLOWED_HOSTS=mcp.hybaliez.xyz
    # 审查修复#5：只读挂载（同 amap）
    volumes:
      - ./data/zotero:/app/data:ro
    networks:
      - net-zotero
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}



# 审查修复#2：各容器各自独立网络，互不可达（消除 /codex 横向访问 grok/admin 绕过 ACL 的路径）
# 对外唯一通道 = 各自 127.0.0.1 端口映射 ← 宿主机 Nginx
networks:
  net-admin:
    name: mcp-net-admin
    driver: bridge
  net-grok:
    name: mcp-net-grok
    driver: bridge
  net-codex:
    name: mcp-net-codex
    driver: bridge
  net-amap:
    name: mcp-net-amap
    driver: bridge
  net-zotero:
    name: mcp-net-zotero
    driver: bridge
